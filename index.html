<!-- MENSAGENS -->
<section style="background: var(--cream); padding: 5rem 2rem;">
  <div style="max-width: 640px; margin: 0 auto;">
    <div class="section-header" style="padding-top: 0; padding-bottom: 2rem;">
      <p class="section-tag">deixa uma mensagem</p>
      <h2>Diz alguma coisa ✦</h2>
    </div>

    <form action="https://formspree.io/f/xqejrgwj" method="POST" data-netlify="true"
      style="background:white; border-radius:24px; padding:2.5rem; box-shadow:0 4px 40px rgba(0,0,0,0.06);">

      <div style="margin-bottom:1.25rem;">
        <label style="font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:#999;display:block;margin-bottom:8px;">O teu nome</label>
        <input type="text" name="nome" required
          style="width:100%;padding:12px 16px;border:1.5px solid #eee;border-radius:12px;font-size:15px;font-family:inherit;outline:none;transition:border 0.2s;"
          onfocus="this.style.borderColor='#FF6B9D'" onblur="this.style.borderColor='#eee'">
      </div>

      <div style="margin-bottom:1.5rem;">
        <label style="font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:#999;display:block;margin-bottom:8px;">A tua mensagem</label>
        <textarea name="mensagem" rows="4" required
          style="width:100%;padding:12px 16px;border:1.5px solid #eee;border-radius:12px;font-size:15px;font-family:inherit;resize:vertical;outline:none;transition:border 0.2s;"
          onfocus="this.style.borderColor='#FF6B9D'" onblur="this.style.borderColor='#eee'"></textarea>
      </div>

      <button type="submit"
  style="background:#1a1a1a;color:white;border:none;padding:14px 32px;border-radius:100px;font-size:14px;font-family:inherit;font-weight:500;cursor:pointer;letter-spacing:0.05em;display:block;margin-top:1rem;">
  Enviar mensagem ✦
</button>
    </form>

    <p style="text-align:center;font-size:12px;color:#bbb;margin-top:1rem;">
      A tua mensagem fica guardada e eu consigo ler todas ✦
    </p>
  </div>
</section>
